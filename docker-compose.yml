services:
  rsshub:
    image: diygod/rsshub:chromium-bundled
    restart: unless-stopped
    ports:
      - "1200:1200"
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
      CACHE_EXPIRE: "600"
      TWITTER_AUTH_TOKEN: "${TWITTER_AUTH_TOKEN:-}"
      TWITTER_CT0: "${TWITTER_CT0:-}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
